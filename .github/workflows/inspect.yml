name: inspect
on:
  push:
    branches: [inspect2]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.0' }
      - run: gradle build
      - name: lookup
        run: |
          M=$(find /home/runner/.gradle -name mappings.jar -path "*yarn*" | head -1)
          mkdir -p /tmp/m && cd /tmp/m && unzip -q -o "$M"
          echo ====FIELDS; grep -E "field_8551|field_22021" mappings/mappings.tiny | head
          echo ====KEYS; grep -E "class_2767\s|class_6880\s" mappings/mappings.tiny | head -3
        continue-on-error: true
